<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" fill="none" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <clipPath id="rounded"><rect width="820" height="240" rx="8" ry="8"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- background + border -->
    <rect width="820" height="240" fill="#0a0a0f"/>
    <rect x="0.5" y="0.5" width="819" height="239" rx="7.5" ry="7.5" stroke="#1a1a2e" stroke-width="1" fill="none"/>

    <!-- title bar -->
    <rect width="820" height="36" fill="#0f0f17"/>
    <line x1="0" y1="36" x2="820" y2="36" stroke="#1a1a2e" stroke-width="1"/>
    <!-- traffic lights: one builds, one breaks, one waits -->
    <circle cx="22" cy="18" r="5" fill="#00e5a0" opacity="0.85"/>
    <circle cx="40" cy="18" r="5" fill="#ff7d6e" opacity="0.7"/>
    <circle cx="58" cy="18" r="5" fill="#5b5b6e" opacity="0.6"/>
    <text x="410" y="22" text-anchor="middle" font-size="12.5" fill="#5b5b6e">toprak@wroclaw: ~</text>

    <!-- prompt -->
    <text x="24" y="82" font-size="15" xml:space="preserve"><tspan fill="#00e5a0">toprak@wroclaw</tspan><tspan fill="#5b5b6e"> ~ % </tspan><tspan fill="#e8e8ed">./toprak</tspan></text>

    <!-- output: the two halves -->
    <text font-size="15">
      <tspan x="28" y="126" fill="#00e5a0" font-weight="700">+</tspan>
      <tspan x="52" y="126" fill="#00e5a0" font-weight="600">build</tspan>
      <tspan x="132" y="126" fill="#e8e8ed">native mac &amp; ios apps that actually ship</tspan>
    </text>
    <text font-size="15">
      <tspan x="28" y="156" fill="#ff7d6e" font-weight="700">&#8722;</tspan>
      <tspan x="52" y="156" fill="#ff7d6e" font-weight="600">break</tspan>
      <tspan x="132" y="156" fill="#e8e8ed">other people&#39;s web &amp; mobile, on hackerone</tspan>
    </text>

    <!-- exit line: the program finished, cleanly -->
    <text x="28" y="190" font-size="13" fill="#5b5b6e">exit 0 &#183; 22 &#183; wroc&#322;aw &#183; cet</text>

    <!-- back at the prompt, still waiting for the next thing -->
    <text x="24" y="222" font-size="15" xml:space="preserve"><tspan fill="#00e5a0">toprak@wroclaw</tspan><tspan fill="#5b5b6e"> ~ % </tspan><tspan fill="#00e5a0">&#9612;<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
